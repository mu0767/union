name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build browser CP-SAT
        run: |
          npm install
          npm run build:cpsat
      - name: Verify raid optimizer objectives
        id: optimizer_tests
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
            node verify-planner-objectives.mjs
            node verify-planner-global-optimization.mjs
          } 2>&1 | tee optimizer-test.log
      - name: Upload optimizer test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: optimizer-test-log
          path: optimizer-test.log
      - name: Stop deployment when optimizer tests fail
        if: steps.optimizer_tests.outcome == 'failure'
        run: exit 1
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Build Blablalink character catalog
        run: npm run build:characters
      - name: Verify managed shared storage bundle
        run: |
          python build-shared-site.py
          node verify-managed-store.mjs
          rm -rf dist
      - name: Stamp deployed version and bust asset cache
        shell: bash
        run: |
          printf '%s\n' "$GITHUB_SHA" > build.txt
          python - <<'PY'
          import os, re
          from pathlib import Path
          sha = os.environ['GITHUB_SHA']
          for name in ('planner.html', 'index.html'):
              path = Path(name)
              if not path.exists():
                  continue
              text = path.read_text(encoding='utf-8')
              text = re.sub(r'((?:src|href)="(?!https?:|#)([^"?]+\.(?:js|css)))(?:\?[^" ]*)?"', lambda m: f'{m.group(1)}?v={sha}"', text)
              path.write_text(text, encoding='utf-8')
          PY
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
