
    </section>

    <section id="view-settings" class="planner-view" hidden>
      <form id="raid-settings" class="settings-card"><div class="section-title"><div><p class="eyebrow">RAID CONFIGURATION</p><h2>레이드 설정</h2></div><button class="primary">설정 저장</button></div>
        <div class="form-grid"><label>레이드 시작<input name="startAt" type="datetime-local" required></label><label>레이드 종료<input name="endAt" type="datetime-local" required></label><label>공격 1회 소요 시간(분)<input name="attackMinutes" type="number" min="1" max="180" required></label><label>동시 공격<select name="simultaneous"><option value="false">한 번에 한 명</option><option value="true">여러 명 가능</option></select></label><label>최종보스 약점<select name="finalElement"><option>철갑</option><option>수냉</option><option>작열</option><option>풍압</option><option>전격</option></select></label><label>현재 시각<input name="now" type="datetime-local" required></label></div>
        <p class="help">하루 경계는 오전 5시입니다. 최적화는 현재 시각부터 종료까지의 모든 시간대를 함께 봅니다.</p>
        <div class="party-heading"><div><h3>보스 정보</h3><p>Round 1~3 각 5명과 최종보스</p></div></div>
        <div class="table-scroll"><table class="party-table"><thead><tr><th>Round</th><th>이름</th><th>약점 속성</th><th>HP</th></tr></thead><tbody id="planner-boss-body"></tbody></table></div>
      </form>
    </section>
  </main>
  <dialog id="attack-detail-dialog">
    <div class="dialog-heading"><div><p class="eyebrow">ATTACK DETAIL</p><h2 id="attack-detail-title">공격 상세</h2></div><button type="button" id="attack-detail-close">닫기</button></div>
    <div id="attack-detail-body"></div>
    <form id="attack-actual-form" class="attack-actual-form">
      <input type="hidden" name="attackIndex">
      <label>실제 딜량<input name="damage" inputmode="numeric" required placeholder="실제 딜 입력"></label>
      <button class="primary">실제 결과 저장</button>
    </form>
  </dialog>
</body>
</html>
